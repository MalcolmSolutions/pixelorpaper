# Cloudflare Workers config (OpenNext), matching main plus the orders database.
name = "pixelorpaper"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pixelorpaper-orders"
# Remote database; local development (--local, next dev, preview) doesn't use it.
database_id = "0f86a9c8-ec88-4d92-b22e-93ea41873f4a"
migrations_dir = "migrations"

[observability.logs]
enabled = true
