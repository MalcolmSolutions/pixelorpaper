# Cloudflare Workers config (OpenNext), matching main plus the orders database.
name = "pixelorpaper"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Settings that aren't secret. Listed here so deploys keep them (variables
# added in the dashboard are removed by the next deploy). Secrets are set
# with `npx wrangler secret put NAME` and never go in this file.
[vars]
R2_S3_ENDPOINT = "https://d6ae1ac1deda0bb0d36408fb08a0fd19.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "base44-images"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pixelorpaper-orders"
# Remote database; local development (--local, next dev, preview) doesn't use it.
database_id = "0f86a9c8-ec88-4d92-b22e-93ea41873f4a"
migrations_dir = "migrations"

[observability.logs]
enabled = true

# Staging: this branch's store as its own Worker at a workers.dev address,
# separate from the live site (the top-level "pixelorpaper" Worker, deployed
# from main). Deploy with `npm run deploy:staging`. Bindings aren't inherited
# by environments, so the database is repeated here. Secrets (Stripe sandbox
# key, R2 keys, Resend, SITE_URL) are set on this Worker with
# `npx wrangler secret put NAME --env staging`.
[env.staging]
name = "pixelorpaper-staging"

# Vars aren't inherited by environments either.
[env.staging.vars]
R2_S3_ENDPOINT = "https://d6ae1ac1deda0bb0d36408fb08a0fd19.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "base44-images"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pixelorpaper-orders"
database_id = "0f86a9c8-ec88-4d92-b22e-93ea41873f4a"
migrations_dir = "migrations"
